# ============================================================================
# Stringtable tools - configuration
#
# Used by BOTH tools:
#   - stringtable_translator.py      (translates, modifies files, makes backups)
#   - check_missing_translations.py  (read-only preparation / estimate tool)
#
# Lines starting with '#' are comments.
# Relative paths are resolved against the folder that contains this file.
# ============================================================================

[paths]
# Folder that is searched recursively for the stringtable files
# (a single .ini file is also accepted).
mods_folder = C:\Path\To\Your\Mods

# Where backups of modified files are stored.
backup_folder = backup

# Where logs are written. Sub-folders:
#   <log_folder>/translation/   logs of the translator (one set of files per run)
#   <log_folder>/check/         logs of the check tool (one log per affected file)
#   <log_folder>/crash_log.txt  unexpected errors
log_folder = logs

# Translation cache. Already translated texts are never sent to DeepL twice.
cache_file = translation_cache_v2.json


[deepl]
# DeepL API key. RECOMMENDED: leave this empty and set the environment
# variable DEEPL_API_KEY instead (the environment variable always wins).
# Free keys end with ":fx" - the Free/Pro endpoint is detected automatically.
api_key =


[translation]
# Target language: DE, EN, FR, IT, ES, CS, HU, PL, RU, ZH
#   - a single language:     target_language = DE
#   - several languages:     target_language = DE, EN
#   - WILDCARD (all missing translations in ALL languages): target_language = ALL
#     The translator shows a warning and asks for your approval before it
#     starts in wildcard mode.
target_language = DE

# Only used with target_language = ALL: languages that must NOT be filled.
# Example: wildcard_exclude = ZH, RU
wildcard_exclude =

# Only used with target_language = ALL: if a line has fewer columns than the
# language needs (older/shorter stringtables), false = skip that language,
# true = append the missing columns to the line.
wildcard_pad_missing_columns = false

# Which language is used as the translation SOURCE. The first language in this
# list that has a real entry (not empty, not "-", not only a tag like [ENG])
# is used. The target language itself is skipped automatically.
source_priority = EN, DE, FR, IT, ES, PL, CS, HU, RU, ZH

# DeepL needs a variant for English as a target: EN-US or EN-GB
english_variant = EN-US

# A cell like "[ENG] Hello world" in the German column is a foreign-language
# copy. true  = treat it as missing and translate it
#               (and use it as a source for other languages)
# false = leave such cells alone
foreign_tag_is_missing = true

# Metadata lines that must NEVER be touched, e.g. CurrentLanguage=English or
# CurrentRevision=0. Comma-separated keys, case-insensitive, wildcards allowed
# (example: Current*).
ignore_keys = CurrentLanguage, CurrentRevision

# Extra safety net for metadata you did not list above: real entries always have
# several language columns separated by ';'. A line whose value contains no ';'
# at all is therefore ignored. Set to false if some of your files contain real
# single-column entries that should still be translated.
skip_entries_without_separator = true

# Files that are processed (matched case-insensitively by file name).
target_files = stringtable.ini, stringtableexpress.ini

# Show the summary and ask [Y/n] before translating?
# (Wildcard mode ALWAYS asks, regardless of this setting.)
confirm_before_start = true


[limits]
# Character cap for ONE run of the translator (the remaining DeepL quota is
# also respected). DeepL Free = 500,000 characters per month.
max_chars_per_run = 450000

# Your plan's monthly quota. Only used by the check tool when the live usage
# cannot be fetched from DeepL (no key / no internet / package missing).
monthly_char_limit = 500000

# Stop after this many API requests in one run (0 = unlimited).
max_requests_per_run = 0

# Rate: minimum pause between two requests, in seconds.
request_delay_seconds = 0.2

# Rate: maximum requests per minute (0 = no extra limit).
max_requests_per_minute = 0

# Retries for temporary errors (timeouts, HTTP 429/5xx), with growing waits:
# retry_wait_seconds, 2x, 3x ...
max_attempts = 3
retry_wait_seconds = 5

# Abort the run cleanly after this many failed texts in a row.
max_consecutive_failures = 5

# Save the translation cache after this many new translations.
cache_save_every = 20


[backup]
# once    = keep ONE backup per file: the very first original (never overwritten)
# per_run = keep a separate backup folder for every run (backup_folder/<timestamp>/...)
mode = once


[tags]
# OPTIONAL: extra placeholder tags that should be recognized, per language.
# The built-in list is already large (ISO codes, Windows codes, English and native
# names - e.g. German: DE, GE, GER, DEU, DEUTSCH; Hungarian: HU, HUN, MAG, MAGYAR).
# Add your own spellings here, comma-separated, WITHOUT the square brackets.
# Tags are recognized in square brackets at the start of a cell: [XYZ] or [ XYZ ].
# A tag may belong to one language only. Language codes: EN, IT, FR, DE, ES, CS, HU, PL, RU, ZH
#
# Example:
#   hu = MAGYARUL, MG
#   de = ALLEMAND